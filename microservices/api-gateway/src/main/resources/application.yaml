eureka:
  client:
    serviceUrl:
      defaultZone : http://localhost:8761/eureka
management:
  tracing:
    sampling:
      probability: 1.0

server:
  port : 8060
spring :
  application :
    name : api-gateway
  config :
    import: "optional:configserver:http://localhost:8088"
  main:
    web-application-type: reactive
  cloud:
    gateway:
      server:
        webmvc:
          enabled: false
